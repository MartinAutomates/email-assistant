<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        /* ── Buttons ── */
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background: #4f46e5; color: #fff; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-small { padding: 4px 10px; font-size: 12px; }

        /* ── Login Screen ── */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            width: 360px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        .login-card h2 {
            font-size: 22px;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group input:focus {
            border-color: #4f46e5;
        }

        #login-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }

        /* ── Main App ── */
        #app-screen { display: none; }

        main {
            max-width: 720px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        #status-msg {
            font-size: 13px;
            color: #6b7280;
            margin-left: auto;
        }

        /* ── Email Cards ── */
        .email-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }

        .email-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        .email-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .email-subject {
            font-weight: 500;
            font-size: 15px;
            flex: 1;
        }

        .email-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .category-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Category colors */
        .cat-urgent   { background: #fee2e2; color: #dc2626; }
        .cat-work     { background: #dbeafe; color: #1d4ed8; }
        .cat-newsletter { background: #f3e8ff; color: #7c3aed; }
        .cat-spam     { background: #f3f4f6; color: #6b7280; }
        .cat-other    { background: #fef9c3; color: #854d0e; }
        .cat-none     { background: #f3f4f6; color: #9ca3af; }

        /* Email body (expandable) */
        .email-body {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
            line-height: 1.6;
            color: #374151;
            white-space: pre-wrap;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .email-body.open { display: block; }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #e5e7eb;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #empty-state {
            text-align: center;
            padding: 48px 0;
            color: #9ca3af;
            display: none;
        }
    </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="login-screen">
    <div class="login-card">
        <h2>📧 Email Assistant</h2>
        <div class="form-group">
            <label for="email-input">Email</label>
            <input type="email" id="email-input" placeholder="you@example.com" value="martin@example.com">
        </div>
        <div class="form-group">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" placeholder="••••••••" value="supersecret123">
        </div>
        <div id="login-error">Invalid email or password.</div>
        <button class="btn-primary" style="width:100%;margin-top:8px" onclick="login()">
            Sign in
        </button>
    </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app-screen">
    <header>
        <h1>📧 Email Assistant</h1>
        <div style="display:flex;gap:8px">
            <button class="btn-secondary" onclick="syncGmail()" id="sync-btn">🔄 Sync Gmail</button>
            <button class="btn-secondary btn-small" onclick="logout()">Sign out</button>
        </div>
    </header>

    <main>
        <div class="toolbar">
            <button class="btn-primary btn-small" onclick="loadEmails()">↻ Refresh</button>
            <span id="status-msg"></span>
        </div>

        <div id="email-list"></div>
        <div id="empty-state">No emails yet. Click "Sync Gmail" to import your inbox.</div>
    </main>
</div>

<script>
    const API = 'http://127.0.0.1:8000';
    let token = null;

    // ── Auth ──────────────────────────────────────────────────────────
    async function login() {
        const email = document.getElementById('email-input').value;
        const password = document.getElementById('password-input').value;
        const errEl = document.getElementById('login-error');
        errEl.style.display = 'none';

        const form = new URLSearchParams();
        form.append('username', email);
        form.append('password', password);

        try {
            const res = await fetch(`${API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: form,
            });

            if (!res.ok) { errEl.style.display = 'block'; return; }

            const data = await res.json();
            token = data.access_token;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            loadEmails();
        } catch (e) {
            errEl.style.display = 'block';
        }
    }

    function logout() {
        token = null;
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('email-list').innerHTML = '';
    }

    // Allow pressing Enter on password field to submit
    document.getElementById('password-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });

    // ── Load Emails ───────────────────────────────────────────────────
    async function loadEmails() {
        setStatus('Loading...');
        try {
            const res = await fetch(`${API}/emails?limit=50`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            renderEmails(data.emails);
            setStatus(`${data.count} email${data.count !== 1 ? 's' : ''}`);
        } catch (e) {
            setStatus('Failed to load emails.');
        }
    }

    // ── Render ────────────────────────────────────────────────────────
    function renderEmails(emails) {
        const list = document.getElementById('email-list');
        const empty = document.getElementById('empty-state');

        if (!emails || emails.length === 0) {
            list.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        list.innerHTML = emails.map(email => `
            <div class="email-card" id="card-${email.email_id}">
                <div class="email-card-header">
                    <div class="email-subject" onclick="toggleBody(${email.email_id})">
                        ${escHtml(email.subject)}
                    </div>
                    <div class="email-actions">
                        <span class="category-badge cat-${email.category || 'none'}">
                            ${email.category || 'unclassified'}
                        </span>
                        <button class="btn-secondary btn-small"
                                onclick="classifyEmail(${email.email_id}, this)" data-subject="${escHtml(email.subject)}"
                                title="Re-classify with AI">
                            AI ✨
                        </button>
                    </div>
                </div>
                <div class="email-body" id="body-${email.email_id}">
                    ${escHtml((email.body || '').substring(0, 1000))}${email.body && email.body.length > 1000 ? '\n...(truncated)' : ''}
                </div>
            </div>
        `).join('');
    }

    function toggleBody(id) {
        const body = document.getElementById(`body-${id}`);
        body.classList.toggle('open');
    }

    // ── Classify ──────────────────────────────────────────────────────
    async function classifyEmail(emailId, btn) {
    const subject = btn.closest('.email-card').querySelector('.email-subject').textContent.trim();
        const card = document.getElementById(`card-${emailId}`);
        const badge = card.querySelector('.category-badge');
        const originalText = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';

        // Get the email body from the DOM (it's already loaded)
        const bodyEl = document.getElementById(`body-${emailId}`);
        const body = bodyEl.textContent.trim() || subject;

        try {
            const res = await fetch(`${API}/classify`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ subject, body })
            });
            const data = await res.json();
            const cat = data.category;

            // Update badge
            badge.className = `category-badge cat-${cat}`;
            badge.textContent = cat;
        } catch (e) {
            badge.textContent = 'error';
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    // ── Sync Gmail ────────────────────────────────────────────────────
    async function syncGmail() {
        const btn = document.getElementById('sync-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Syncing...';
        setStatus('Syncing Gmail...');

        try {
            const res = await fetch(`${API}/sync-gmail?max_emails=20`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            setStatus(`Synced ${data.synced} new, skipped ${data.skipped}`);
            if (data.synced > 0) loadEmails();
        } catch (e) {
            setStatus('Sync failed.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🔄 Sync Gmail';
        }
    }

    // ── Helpers ───────────────────────────────────────────────────────
    function setStatus(msg) {
        document.getElementById('status-msg').textContent = msg;
    }

    function escHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>

</body>
</html>
